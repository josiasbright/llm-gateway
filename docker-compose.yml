# Base PostgreSQL pour le développement local.
# La version doit être alignée sur celle de l'hébergeur retenu (à vérifier avant E14).
services:
  db:
    image: postgres:16-alpine
    container_name: llm-gateway-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Copier .env.example en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copier .env.example en .env}
      POSTGRES_DB: ${POSTGRES_DB:?Copier .env.example en .env}
    ports:
                  - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:
